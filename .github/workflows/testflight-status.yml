name: TestFlight status

# Read-only: where the latest builds stand in App Store Connect (processing, export compliance, tester groups) and
# what the App Store profile in the secrets allows. The logs are public, so it prints states and numbers only.
# Runs when this check changes, or by hand.
on:
  push:
    branches:
      - v26-integration
      - claude/project-thread-9pucu2
    paths:
      - .github/workflows/testflight-status.yml
      - .github/scripts/testflight-status.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Where the latest builds stand
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 .github/scripts/testflight-status.py
