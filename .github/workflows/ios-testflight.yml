name: iOS TestFlight

on:
  # Edem, 21 Nov 2026: builds go to TestFlight by themselves when new app work lands, without anyone pressing Run
  # workflow. A push builds the review build: Ama's sample life on, starting from the beginning, uploaded. Pushes that
  # only touch notes or the server don't build. Runs queue (see concurrency), so a burst of pushes makes one build.
  push:
    branches:
      - v26-integration
      - claude/project-thread-9pucu2
    paths:
      - apps/mobile/**
      - packages/**
      - .github/workflows/ios-testflight.yml
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed build to App Store Connect for TestFlight processing
        type: boolean
        default: true
      build_number:
        description: Optional build number. Left empty, it is this run's number plus 30, above every build uploaded so far
        type: string
        required: false
      sample_life:
        description: Show Ama's sample life (review builds for the owner). Turn off for builds real people use.
        type: boolean
        default: true
      start_fresh:
        description: Start from the beginning (intro, sign-in, setup) the first time this build opens, setting aside what an older build left on the phone. Only with the sample life on.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check signing configuration without revealing values
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          UPLOAD: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        shell: bash
        run: |
          missing=0
          names=(IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64)
          if [[ "$UPLOAD" == true ]]; then names+=(ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_APP_ID); fi
          for name in "${names[@]}"; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing GitHub configuration: $name"; missing=1; fi
          done
          exit "$missing"

  build:
    needs: preflight
    runs-on: macos-26
    # One build queue per branch: the review branch and v26-integration build side by side, and a burst of pushes to
    # one branch makes one build. Only the build waits its turn, not the wait for Apple's verdict after it.
    concurrency:
      group: ios-build-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    timeout-minutes: 60
    environment: testflight
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number }}
      EXPO_PUBLIC_SAMPLE_DATA: ${{ (github.event_name == 'push' || inputs.sample_life) && '1' || '0' }}
      START_FRESH: ${{ (github.event_name == 'push' || (inputs.sample_life && inputs.start_fresh)) && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Check Xcode
        run: xcodebuild -version
      # Build numbers 22 and 7 are already in App Store Connect, so an empty box starts above them. A review build that
      # starts from the beginning uses its build number as the marker (apps/mobile/src/state/freshStart.ts).
      - name: Choose the build number
        id: number
        run: |
          number="${BUILD_NUMBER:-$((GITHUB_RUN_NUMBER + 30))}"
          [[ "$number" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::The build number must be digits, such as 40"; exit 1; }
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          if [[ "$START_FRESH" == 1 ]]; then echo "EXPO_PUBLIC_FRESH_START=$number" >> "$GITHUB_ENV"; fi
          echo "Build $number, sample life $EXPO_PUBLIC_SAMPLE_DATA, start from the beginning $START_FRESH"
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native project with SQLCipher
        run: npm run ios:prepare
      - name: Install native dependencies
        run: pod install --project-directory=ios
      - name: Archive and export signed IPA
        id: archive
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/ci-ios-archive.sh
      # The signed IPA remains only on GitHub's ephemeral runner. This repository
      # is public, so upload directly to Apple rather than retaining an artifact.
      - name: Upload for TestFlight processing
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          IPA_PATH: ${{ steps.archive.outputs.ipa_path }}
          BUNDLE_ID: ${{ steps.archive.outputs.bundle_id }}
          APP_VERSION: ${{ steps.archive.outputs.app_version }}
        run: bash scripts/ci-testflight-upload.sh

  # Apple checks each upload after it arrives and can still turn it down (build 42, 21 Nov). This waits for that
  # verdict, shows Apple's reasons if it fails, and otherwise adds the build to the internal tester group, which
  # doesn't take new builds by itself, so it shows in TestFlight without anyone tapping in App Store Connect.
  distribute:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: testflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for Apple, then give the build to the internal testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: python3 .github/scripts/testflight-status.py distribute
