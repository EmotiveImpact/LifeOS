name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed build to App Store Connect for TestFlight processing
        type: boolean
        default: true
      build_number:
        description: Optional higher build number if this version already exists in App Store Connect
        type: string
        required: false
      sample_life:
        description: Show Ama's sample life (review builds for the owner). Turn off for builds real people use.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check signing configuration without revealing values
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          UPLOAD: ${{ inputs.upload_to_testflight }}
        shell: bash
        run: |
          missing=0
          names=(IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64)
          if [[ "$UPLOAD" == true ]]; then names+=(ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_APP_ID); fi
          for name in "${names[@]}"; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing GitHub configuration: $name"; missing=1; fi
          done
          exit "$missing"

  build:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      EXPO_PUBLIC_SAMPLE_DATA: ${{ inputs.sample_life && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native project with SQLCipher
        run: npm run ios:prepare
      - name: Install native dependencies
        run: pod install --project-directory=ios
      - name: Archive and export signed IPA
        id: archive
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/ci-ios-archive.sh
      # The signed IPA remains only on GitHub's ephemeral runner. This repository
      # is public, so upload directly to Apple rather than retaining an artifact.
      - name: Upload for TestFlight processing
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          IPA_PATH: ${{ steps.archive.outputs.ipa_path }}
          BUNDLE_ID: ${{ steps.archive.outputs.bundle_id }}
          APP_VERSION: ${{ steps.archive.outputs.app_version }}
        run: bash scripts/ci-testflight-upload.sh
