<template id="v24-interface">
  <link rel="stylesheet" href="v24/board.css">
  <header class="board-bar">
    <span class="brand"><i class="dotring"></i>life</span>
    <span class="board-name">Complete design board <b>V24</b></span>
    <div class="board-controls">
      <label><span class="sr">Jump to a chapter</span><select id="chapter"><option value="">Jump to chapter</option></select></label>
      <button id="theme" type="button" aria-label="Switch to light theme"></button>
    </div>
  </header>
  <div class="board-lead">
    <h1>LifeOS</h1>
    <p id="board-count"></p>
    <nav id="chapter-shortcuts" aria-label="Explore the redesign"></nav>
  </div>
  <section id="gallery" aria-label="Today, Plan, You and Talk"></section>
  <dialog id="viewer" aria-label="Full-size screen">
    <div class="view-tools">
      <button id="close">← Board</button>
      <strong id="screen-name"></strong>
      <button id="forward" aria-label="Next featured screen">Next →</button>
    </div>
    <div id="full-phone"></div>
  </dialog>
</template>
<div id="v24-interface-host"></div>
<main id="v24-chapters" aria-label="All board chapters"></main>
<link rel="stylesheet" href="v24/full-board.css">
<script src="v24/catalogue.js"></script>
<link rel="stylesheet" href="v24/screens.css">
<script src="v24/screens.js"></script>
<script src="v24/board.js"></script>
